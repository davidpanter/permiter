name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          mkdir permiter-${{ github.ref_name }}-${{ matrix.target }}
          cp target/${{ matrix.target }}/release/permiter permiter-${{ github.ref_name }}-${{ matrix.target }}/
          cp README.md LICENSE permiter-${{ github.ref_name }}-${{ matrix.target }}/
          tar czf permiter-${{ github.ref_name }}-${{ matrix.target }}.tar.gz permiter-${{ github.ref_name }}-${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: permiter-${{ matrix.target }}
          path: permiter-${{ github.ref_name }}-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: permiter-*.tar.gz
          generate_release_notes: true
